<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxd man Texture Packs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="title">Bloxd man Texture Packs</h1>

    <!-- PAGE 1 CONTENT -->
    <div class="pack-grid" id="page-1">

        <div class="card" onclick="downloadPack('files/freyon.zip')">
            <img src="thumbs/freyon.png" alt="Freyon">
            <div class="card-overlay">
                <h2 style="color: #ff3333;">FREYON</h2>
                <p>Last update: 11th August</p>
            </div>
        </div>

        <div class="card" onclick="downloadPack('files/astray.zip')">
            <img src="thumbs/astray.png" alt="Astray">
            <div class="card-overlay">
                <h2 style="color: #38bdf8;">ASTRAY</h2>
                <p>Last update: 11th August</p>
            </div>
        </div>

        <div class="card" onclick="downloadPack('files/barebones.zip')">
            <img src="thumbs/barebones.png" alt="Bare Bones">
            <div class="card-overlay">
                <h2 style="color: #facc15;">BARE BONES</h2>
                <p>Last update: 11th August</p>
            </div>
        </div>

        <div class="card" onclick="downloadPack('files/sublight.zip')">
            <img src="thumbs/sublight.png" alt="Sublight">
            <div class="card-overlay">
                <h2 style="color: #e879f9;">SUBLIGHT</h2>
                <p>Last update: 11th August</p>
            </div>
        </div>

    </div>

    <!-- PAGE 2 CONTENT (Hidden by default) -->
    <div class="pack-grid hidden" id="page-2">

        <div class="card" onclick="downloadPack('files/pack5.zip')">
            <img src="thumbs/pack5.png" alt="Pack 5">
            <div class="card-overlay">
                <h2 style="color: #22c55e;">CYBER</h2>
                <p>Last update: 15th August</p>
            </div>
        </div>

    </div>

    <!-- Pagination Controls -->
    <div class="pagination">
        <button class="nav-btn" id="prev-btn">◀</button>
        <span class="page-text" id="page-indicator">Page 1 / 2</span>
        <button class="nav-btn" id="next-btn">▶</button>
    </div>

    <!-- Bottom Social Links -->
    <footer class="footer-links">
        <a href="https://youtube.com" target="_blank">YouTube</a>
        <a href="https://discord.gg" target="_blank">Discord</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
